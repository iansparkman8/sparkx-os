
name: ZIP_NAME="SparkXFairyOS-BuildTestOne-PLUS-v3-JVM17-FIX.zip"
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-debug-apk:
    name: Build Debug APK From Uploaded ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Show repo files
        run: |
          pwd
          ls -la

      - name: Unzip SparkX Fairy OS package
        run: |
          ZIP_NAME="SparkXFairyOS-BuildTestOne-PLUS-v2.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "Could not find $ZIP_NAME"
            echo "Files in repo:"
            ls -la
            exit 1
          fi

          unzip -q "$ZIP_NAME"
          echo "Unzipped package:"
          ls -la
          echo "Project folder:"
          ls -la SparkXFairyOS-BuildTestOne-v2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Static preflight checks
        working-directory: SparkXFairyOS-BuildTestOne-v2
        run: |
          bash scripts/preflight_static_check.sh .

      - name: Compile debug Kotlin
        working-directory: SparkXFairyOS-BuildTestOne-v2
        run: |
          gradle :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: SparkXFairyOS-BuildTestOne-v2
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkXFairyOS-debug-apk
          path: SparkXFairyOS-BuildTestOne-v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
